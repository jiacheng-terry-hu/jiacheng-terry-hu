<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Jiacheng(Terry) Hu — From Data Science to Applied Data Science</title>
  <desc id="desc">An original midnight blue banner with a geometric chart in teal, gold, and maroon. Jiacheng Hu, who goes by Terry, studies Applied Data Science at UChicago after studying Data Science at UC Berkeley.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#101a2a"/><stop offset=".62" stop-color="#14242e"/><stop offset="1" stop-color="#1c3037"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#397a80" stop-opacity=".12"/><stop offset="1" stop-color="#83b9b1" stop-opacity=".55"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#bfdbd4" stroke-width=".5" opacity=".065"/></pattern>
    <clipPath id="edge"><rect width="1600" height="480" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="1600" height="480" fill="url(#background)"/>
    <rect width="1600" height="480" fill="url(#grid)"/>
    <circle cx="1505" cy="58" r="210" fill="#854154" opacity=".2"/>
    <circle cx="1480" cy="425" r="205" fill="#558d8b" opacity=".08"/>
    <g stroke="#a5c4bf" fill="none" opacity=".15">
      <path d="M1150 105v300h330M1150 330h330M1150 255h330M1150 180h330"/>
      <path d="M1240 105v300M1330 105v300M1420 105v300" stroke-dasharray="3 8"/>
    </g>
    <g fill="url(#teal)">
      <rect x="1180" y="296" width="42" height="109" rx="4"/>
      <rect x="1238" y="247" width="42" height="158" rx="4"/>
      <rect x="1296" y="202" width="42" height="203" rx="4"/>
      <rect x="1354" y="230" width="42" height="175" rx="4"/>
      <rect x="1412" y="157" width="42" height="248" rx="4"/>
    </g>
    <path d="M1166 282C1220 282 1218 209 1278 211S1360 276 1392 214 1430 124 1480 119" fill="none" stroke="#d2ad7c" stroke-width="3"/>
    <circle cx="1166" cy="282" r="5" fill="#d2ad7c"/><circle cx="1278" cy="211" r="5" fill="#d2ad7c"/><circle cx="1392" cy="214" r="5" fill="#d2ad7c"/><circle cx="1480" cy="119" r="5" fill="#d2ad7c"/>
