    <text x="111" y="99" fill="#d1ae7c" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="4">DATA · MODELS · SYSTEMS</text>
    <text x="79" y="232" fill="#f4eee5" font-family="Georgia,'Times New Roman',serif" font-size="86" letter-spacing="-1.5">Jiacheng(Terry) Hu</text>
    <text x="85" y="293" fill="#c5d8d7" font-family="Arial,Helvetica,sans-serif" font-size="27">Applied Data Science · University of Chicago</text>
    <text x="85" y="337" fill="#91aaa9" font-family="Arial,Helvetica,sans-serif" font-size="21" letter-spacing="1.5">PHYSICAL SCIENCES DIVISION</text>
    <path d="M85 374h907" stroke="#94b0af" stroke-width="1" opacity=".24"/>
    <text x="85" y="419" fill="#bbc4c8" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="1.4">UC BERKELEY / DATA SCIENCE → UCHICAGO / APPLIED DATA SCIENCE</text>
